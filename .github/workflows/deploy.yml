# Builds the game and publishes it to GitHub Pages
# every time something is merged into main.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer one cancels an older one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install packages
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the game
        run: npm run build

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload the built game
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5