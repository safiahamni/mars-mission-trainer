# Checks every pull request: install, test and build.
# If any step fails, the pull request shows a red X so nobody merges broken code.
name: Check pull request

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install packages
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the game
        run: npm run build